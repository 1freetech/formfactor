name: validate

on:
  push:
    branches:
      - main
      - 'validation/**'
      - 'update/**'
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FormFactor
        uses: actions/checkout@v4

      - name: Install native and Godot validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev curl unzip

      - name: Install official Godot 4.7.2 stable validator
        run: |
          set -euo pipefail
          mkdir -p .tools/godot
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d .tools/godot
          chmod +x .tools/godot/Godot_v4.7.2-stable_linux.x86_64
          .tools/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Verify FormFactor identity
        run: python3 scripts/check_identity.py

      - name: Verify Unity 6.3 C# frontend structure
        run: python3 scripts/check_unity_frontend.py

      - name: Validate deterministic CAD bridge
        run: python3 tests/test_cad_bridge.py

      - name: Validate actual Godot 3D scene, materials, gameplay, CAD, and 1.121 interaction systems
        run: |
          set -euo pipefail
          GODOT=.tools/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path godot --editor --quit-after 1
          "$GODOT" --headless --path godot --script res://scripts/validate_3d.gd
          "$GODOT" --headless --path godot --script res://scripts/validate_gameplay.gd
          "$GODOT" --headless --path godot --script res://scripts/validate_gameplay_108.gd
          "$GODOT" --headless --path godot --script res://scripts/validate_cad.gd
          "$GODOT" --headless --path godot --script res://scripts/validate_gameplay_1121.gd

      - name: Run complete direct-compiler validation suite
        run: sh scripts/validate.sh

      - name: Configure CMake engineering and FreeLab targets
        run: cmake -S . -B build-cmake

      - name: Build CMake engineering and FreeLab targets
        run: cmake --build build-cmake --parallel 2

      - name: Run complete CTest suite
        run: ctest --test-dir build-cmake --output-on-failure

      - name: Run focused strict-warning sanitizer checks
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            src/quantity.cpp tests/quantity_tests.cpp \
            -o build/quantity_sanitizer_tests
          ASAN_OPTIONS=detect_leaks=1 ./build/quantity_sanitizer_tests
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            src/hash.cpp src/policy_trust.cpp src/policy_signature.cpp \
            tests/regression/formfactor_cr_19_ed25519_signature_verification.cpp \
            -lcrypto -o build/policy_signature_sanitizer_tests
          ASAN_OPTIONS=detect_leaks=1 ./build/policy_signature_sanitizer_tests
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            src/hash.cpp src/policy_trust.cpp src/key_authority.cpp \
            tests/regression/formfactor_cr_20_pinned_key_trust_root.cpp \
            -o build/key_authority_sanitizer_tests
          ASAN_OPTIONS=detect_leaks=1 ./build/key_authority_sanitizer_tests
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            src/hash.cpp src/policy_trust.cpp src/key_authority.cpp \
            tests/regression/formfactor_cr_21_root_update_sequence.cpp \
            -o build/root_transition_sanitizer_tests
          ASAN_OPTIONS=detect_leaks=1 ./build/root_transition_sanitizer_tests

  frontend-layers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FormFactor
        uses: actions/checkout@v4

      - name: Set up Node for TypeScript inspector
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify five-language layer structure
        run: python3 scripts/check_language_layers.py

      - name: Verify Python-generated Unity and Godot visual manifests
        run: python3 tools/visual_pipeline/build_visual_manifest.py --check

      - name: Install pinned TypeScript compiler
        working-directory: web/formfactor-inspector
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Type-check browser inspector
        working-directory: web/formfactor-inspector
        run: npm run typecheck

      - name: Build browser inspector
        working-directory: web/formfactor-inspector
        run: npm run build
