name: validate

on:
  push:
    branches:
      - main
      - 'validation/**'
  pull_request:

jobs:
  engineering-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pcbtech
        uses: actions/checkout@v4

      - name: Run complete dependency-free validation suite
        run: sh scripts/validate.sh

      - name: Run exact-quantity test with strict warnings and sanitizers
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            src/quantity.cpp tests/quantity_tests.cpp \
            -o build/quantity_sanitizer_tests
          ASAN_OPTIONS=detect_leaks=1 ./build/quantity_sanitizer_tests
