name: validate

on:
  push:
    branches:
      - main
      - 'validation/**'
      - 'update/**'
  pull_request:

jobs:
  engineering-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FormFactor
        uses: actions/checkout@v4

      - name: Install legacy SDL workbench build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Verify FormFactor identity
        run: python3 scripts/check_identity.py

      - name: Verify Unity 6.3 C# frontend structure
        run: python3 scripts/check_unity_frontend.py

      - name: Run complete direct-compiler validation suite
        run: sh scripts/validate.sh

      - name: Configure CMake engineering and legacy SDL workbench targets
        run: cmake -S . -B build-cmake

      - name: Build CMake engineering and legacy SDL workbench targets
        run: cmake --build build-cmake --parallel 2

      - name: Run complete CTest suite
        run: ctest --test-dir build-cmake --output-on-failure

      - name: Run focused strict-warning sanitizer checks
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            src/quantity.cpp tests/quantity_tests.cpp \
            -o build/quantity_sanitizer_tests
          ASAN_OPTIONS=detect_leaks=1 ./build/quantity_sanitizer_tests
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            src/hash.cpp src/policy_trust.cpp src/policy_signature.cpp \
            tests/regression/formfactor_cr_19_ed25519_signature_verification.cpp \
            -lcrypto -o build/policy_signature_sanitizer_tests
          ASAN_OPTIONS=detect_leaks=1 ./build/policy_signature_sanitizer_tests
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            src/hash.cpp src/policy_trust.cpp src/key_authority.cpp \
            tests/regression/formfactor_cr_20_pinned_key_trust_root.cpp \
            -o build/key_authority_sanitizer_tests
          ASAN_OPTIONS=detect_leaks=1 ./build/key_authority_sanitizer_tests
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            src/hash.cpp src/policy_trust.cpp src/key_authority.cpp \
            tests/regression/formfactor_cr_21_root_update_sequence.cpp \
            -o build/root_transition_sanitizer_tests
          ASAN_OPTIONS=detect_leaks=1 ./build/root_transition_sanitizer_tests
