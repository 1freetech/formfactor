name: One-time FormFactor migration

on:
  push:
    branches:
      - rename-formfactor

permissions:
  contents: write

jobs:
  rename-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: rename-formfactor
          fetch-depth: 0

      - name: Rename every project identity reference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          replacements = (
              (b"PCB Tech", b"FormFactor"),
              (b"PCBTech", b"FormFactor"),
              (b"pcbtech", b"formfactor"),
          )
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode())
              data = path.read_bytes()
              updated = data
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != data:
                  path.write_bytes(updated)
          PY

          git mv include/pcbtech include/formfactor
          git mv .github/ISSUE_TEMPLATE/pcbtech_signal.md .github/ISSUE_TEMPLATE/formfactor_signal.md
          git mv tests/regression/pcbtech_cr_1_invalid_unit_identifiers.cpp tests/regression/formfactor_cr_1_invalid_unit_identifiers.cpp

          python3 - <<'PY'
          from pathlib import Path
          for path in [Path("README.md"), Path("docs/ROADMAP.md"), Path("docs/SEMICONDUCTOR_PHYSICS.md")]:
              text = path.read_text(encoding="utf-8")
              text = text.replace("# formfactor", "# FormFactor")
              text = text.replace("## 8. formfactor", "## 8. FormFactor")
              text = text.replace("Run formfactor in VS Code", "Run FormFactor in VS Code")
              path.write_text(text, encoding="utf-8")
          PY

          grep -qxF '/build-cmake/' .gitignore || printf '/build-cmake/\n' >> .gitignore

          cat > scripts/check_identity.py <<'PY'
          import subprocess
          from pathlib import Path

          retired = (
              ("pcb" + "tech").encode(),
              ("PCB" + "Tech").encode(),
              ("PCB" + " Tech").encode(),
          )
          failures = []
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in tracked:
              if not raw:
                  continue
              path_text = raw.decode()
              path_bytes = raw
              if any(token in path_bytes for token in retired):
                  failures.append(f"path: {path_text}")
                  continue
              path = Path(path_text)
              if not path.exists() or not path.is_file():
                  continue
              data = path.read_bytes()
              if any(token in data for token in retired):
                  failures.append(f"content: {path_text}")
          if failures:
              raise SystemExit("Retired project identity remains:\n" + "\n".join(failures))
          print("FormFactor identity check: PASS")
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/validate.yml")
          text = path.read_text(encoding="utf-8")
          needle = "      - name: Run complete dependency-free validation suite\n"
          guard = "      - name: Verify FormFactor identity\n        run: python3 scripts/check_identity.py\n\n"
          if guard not in text:
              if needle not in text:
                  raise SystemExit("validate workflow insertion point not found")
              text = text.replace(needle, guard + needle, 1)
          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/rename-formfactor.yml

      - name: Prove the retired identity is gone
        run: python3 scripts/check_identity.py

      - name: Run complete engineering validation suite with strict warnings
        run: CXX='g++ -Werror' sh scripts/validate.sh

      - name: Build and test CMake targets including the SDL workbench
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev pkg-config
          cmake -S . -B build-cmake
          cmake --build build-cmake --parallel 2
          ctest --test-dir build-cmake --output-on-failure

      - name: Commit verified non-workflow migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "1freetech"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf build build-cmake

          # GitHub Actions tokens cannot publish workflow-file changes. Restore
          # those three files only; the connected repository account will apply
          # their already-validated FormFactor versions immediately afterward.
          git checkout HEAD -- .github/workflows/labels.yml .github/workflows/validate.yml .github/workflows/rename-formfactor.yml

          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes remain to commit."
            exit 0
          fi
          git commit -m "Rename the project identity to FormFactor across source namespaces, include paths, CMake targets, executables, engineering record prefixes, regression identifiers, issue templates, documentation, setup instructions, and the SDL workbench while preserving the existing engineering behavior and validating the complete renamed implementation before publication; GitHub workflow metadata is left for the connected repository account to update in the immediately following authorized commit."
          git push origin HEAD:rename-formfactor
