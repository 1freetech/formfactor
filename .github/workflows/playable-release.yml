name: playable-release

on:
  push:
    branches:
      - main
      - 'validation/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formfactor-playable-release-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_LINUX_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_WINDOWS_SHA256: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out FormFactor
        uses: actions/checkout@v4

      - name: Download official Godot 4.7.2 Linux engine
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o godot-linux.zip \
            https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "${GODOT_LINUX_SHA256}  godot-linux.zip" | sha256sum -c -
          unzip -q godot-linux.zip -d godot-engine
          chmod +x godot-engine/Godot_v4.7.2-stable_linux.x86_64
          godot-engine/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Prove the playable client contains real 3D meshes and materials
        shell: bash
        run: |
          set -euo pipefail
          GODOT=godot-engine/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path godot --editor --quit-after 1
          "$GODOT" --headless --path godot --script res://scripts/validate_3d.gd

      - name: Verify engineering core identity
        run: python3 scripts/check_identity.py

      - name: Package real Godot 3D Linux game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-linux/scenes package-linux/scripts
          cp godot-engine/Godot_v4.7.2-stable_linux.x86_64 package-linux/FormFactor
          cp godot/project.godot package-linux/project.godot
          cp godot/scenes/main.tscn package-linux/scenes/main.tscn
          cp godot/scripts/material_lab.gd package-linux/scripts/material_lab.gd
          cp godot/scripts/validate_3d.gd package-linux/scripts/validate_3d.gd
          cat > package-linux/PLAY_FORMFACTOR.sh <<'SH'
          #!/usr/bin/env bash
          set -e
          cd "$(dirname "$0")"
          exec ./FormFactor --path .
          SH
          cat > package-linux/README.txt <<'TXT'
          FormFactor 1.06 - Material 3D Lab

          This is the real Godot 4.7.2 3D client, not the older flat SDL prototype.

          PLAY
          1. Extract the archive.
          2. Double-click PLAY_FORMFACTOR.sh if your desktop allows it, or run ./PLAY_FORMFACTOR.sh.
          3. Left-click the physical 3D power source, then the 3D LED.
          4. Right-drag or middle-drag to orbit the board. Use the mouse wheel to zoom.
          5. When the training path completes, the LED changes to an emissive 3D material and a current marker moves along the 3D connection.

          The engineering C++ core remains separately validated. The 3D client does not invent missing electrical values.
          Godot is open source under the MIT license: https://godotengine.org/license/
          TXT
          chmod +x package-linux/FormFactor package-linux/PLAY_FORMFACTOR.sh
          tar -czf FormFactor-Linux-x64.tar.gz -C package-linux .

      - name: Upload Linux 3D package
        uses: actions/upload-artifact@v4
        with:
          name: linux-playable
          path: FormFactor-Linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out FormFactor
        uses: actions/checkout@v4

      - name: Download official Godot 4.7.2 Windows engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION/Godot_v4.7.2-stable_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile godot-windows.zip
          $actual = (Get-FileHash godot-windows.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:GODOT_WINDOWS_SHA256) {
            throw "Godot Windows SHA256 mismatch: $actual"
          }
          Expand-Archive godot-windows.zip -DestinationPath godot-engine -Force
          & .\godot-engine\Godot_v4.7.2-stable_win64.exe --version

      - name: Prove the Windows client loads real Godot 3D materials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = '.\godot-engine\Godot_v4.7.2-stable_win64.exe'
          & $godot --headless --path godot --editor --quit-after 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $godot --headless --path godot --script res://scripts/validate_3d.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package real Godot 3D Windows game
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force package-windows\scenes | Out-Null
          New-Item -ItemType Directory -Force package-windows\scripts | Out-Null
          Copy-Item godot-engine\Godot_v4.7.2-stable_win64.exe package-windows\FormFactor.exe
          Copy-Item godot\project.godot package-windows\project.godot
          Copy-Item godot\scenes\main.tscn package-windows\scenes\main.tscn
          Copy-Item godot\scripts\material_lab.gd package-windows\scripts\material_lab.gd
          Copy-Item godot\scripts\validate_3d.gd package-windows\scripts\validate_3d.gd
          @'
          @echo off
          cd /d "%~dp0"
          start "" "FormFactor.exe" --path "%~dp0"
          '@ | Set-Content -Encoding ASCII package-windows\PLAY_FORMFACTOR.bat
          @'
          FormFactor 1.06 - Material 3D Lab

          This is the real Godot 4.7.2 3D client, not the older flat SDL prototype.

          PLAY
          1. Extract this ZIP.
          2. Double-click PLAY_FORMFACTOR.bat. FormFactor.exe is the official Godot 4.7.2 engine renamed for this package.
          3. Left-click the physical 3D power source, then the 3D LED.
          4. Right-drag or middle-drag to orbit the board. Use the mouse wheel to zoom.
          5. When the training path completes, the LED changes to an emissive 3D material and a current marker moves along the 3D connection.

          The engineering C++ core remains separately validated. The 3D client does not invent missing electrical values.
          Godot is open source under the MIT license: https://godotengine.org/license/
          '@ | Set-Content -Encoding UTF8 package-windows\README.txt
          Compress-Archive -Path package-windows\* -DestinationPath FormFactor-Windows-x64.zip -Force

      - name: Upload Windows 3D package
        uses: actions/upload-artifact@v4
        with:
          name: windows-playable
          path: FormFactor-Windows-x64.zip
          if-no-files-found: error

  publish-latest:
    if: github.ref == 'refs/heads/main'
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out FormFactor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download tested 3D packages
        uses: actions/download-artifact@v4
        with:
          pattern: '*-playable'
          path: dist
          merge-multiple: true

      - name: Point latest tag at this tested 3D commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Create or refresh latest real 3D playable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Tested FormFactor 1.06+ material 3D build powered by Godot 4.7.2. Both packages pass the runtime 3D gate for MeshInstance3D geometry, StandardMaterial3D materials, metallic surfaces, Camera3D, real lights, clickable 3D bodies, emissive LED feedback, 3D wiring, and the animated current marker."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/FormFactor-Windows-x64.zip dist/FormFactor-Linux-x64.tar.gz --clobber
            gh release edit latest --title "FormFactor - Latest Material 3D Build" --notes "$NOTES" --latest
          else
            gh release create latest dist/FormFactor-Windows-x64.zip dist/FormFactor-Linux-x64.tar.gz \
              --title "FormFactor - Latest Material 3D Build" --notes "$NOTES"
          fi
