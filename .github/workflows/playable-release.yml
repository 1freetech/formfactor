name: playable-release

on:
  push:
    branches:
      - main
      - 'validation/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formfactor-playable-release-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_LINUX_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_WINDOWS_SHA256: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out FormFactor
        uses: actions/checkout@v4

      - name: Download official Godot 4.7.2 Linux engine
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o godot-linux.zip \
            https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "${GODOT_LINUX_SHA256}  godot-linux.zip" | sha256sum -c -
          unzip -q godot-linux.zip -d godot-engine
          chmod +x godot-engine/Godot_v4.7.2-stable_linux.x86_64
          godot-engine/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Validate source gameplay before packaging
        shell: bash
        run: |
          set -euo pipefail
          GODOT=godot-engine/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path godot --editor --quit-after 1
          "$GODOT" --headless --path godot --script res://scripts/validate_3d.gd
          "$GODOT" --headless --path godot --script res://scripts/validate_gameplay.gd

      - name: Verify engineering core identity
        run: python3 scripts/check_identity.py

      - name: Package complete Godot Linux game
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          mkdir -p package-linux
          cp godot-engine/Godot_v4.7.2-stable_linux.x86_64 package-linux/FormFactor
          cp godot/project.godot package-linux/project.godot
          cp -R godot/scenes package-linux/scenes
          cp -R godot/scripts package-linux/scripts
          cp VERSION package-linux/VERSION
          cat > package-linux/PLAY_FORMFACTOR.sh <<'SH'
          #!/usr/bin/env bash
          set -e
          cd "$(dirname "$0")"
          exec ./FormFactor --path .
          SH
          cat > package-linux/README.txt <<TXT
          FormFactor ${VERSION} - PCB Training + Build Lab

          PLAY
          1. Extract the archive and run ./PLAY_FORMFACTOR.sh.
          2. Pick a component from the left component menu and click the PCB to place it.
          3. Drag a placed component to move it. Drag empty board/workbench space to rotate the camera.
          4. Click a placed component and use Q/E or the on-screen buttons to rotate the component.
          5. Use WIRE to connect parts and TEST to validate a connected power-to-LED path.
          6. Open LEARN // 100 LESSONS for the guided PCB curriculum from basics through capstone boards.
          7. Every lesson increases in designed difficulty by 1 percent. Training certificates unlock at 10, 25, 50, 75, and 100 completed lessons.
          8. The live schematic mirror and 25-family component lexicon stay available while you build.

          Certificate note: the game can generate a named local digital completion certificate. Automatic email delivery requires a separately configured secure FORMFACTOR_CERTIFICATE_API service so mail credentials are never embedded in the game executable.

          Godot is open source under the MIT license: https://godotengine.org/license/
          TXT
          chmod +x package-linux/FormFactor package-linux/PLAY_FORMFACTOR.sh
          package-linux/FormFactor --headless --path package-linux --quit-after 3
          tar -czf "FormFactor-${VERSION}-Linux-x64.tar.gz" -C package-linux .
          test -s "FormFactor-${VERSION}-Linux-x64.tar.gz"

      - name: Upload Linux playable
        uses: actions/upload-artifact@v4
        with:
          name: linux-playable
          path: FormFactor-*-Linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out FormFactor
        uses: actions/checkout@v4

      - name: Download official Godot 4.7.2 Windows engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION/Godot_v4.7.2-stable_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile godot-windows.zip
          $actual = (Get-FileHash godot-windows.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:GODOT_WINDOWS_SHA256) {
            throw "Godot Windows SHA256 mismatch: $actual"
          }
          Expand-Archive godot-windows.zip -DestinationPath godot-engine -Force
          if (-not (Test-Path .\godot-engine\Godot_v4.7.2-stable_win64_console.exe)) {
            throw 'Godot console executable is missing from the official archive.'
          }
          & .\godot-engine\Godot_v4.7.2-stable_win64_console.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Godot console version check failed with code $LASTEXITCODE" }

      - name: Validate source gameplay on Windows console runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = '.\godot-engine\Godot_v4.7.2-stable_win64_console.exe'
          & $godot --headless --path godot --editor --quit-after 1
          if ($LASTEXITCODE -ne 0) { throw "Godot editor scan failed with code $LASTEXITCODE" }
          & $godot --headless --path godot --script res://scripts/validate_3d.gd
          if ($LASTEXITCODE -ne 0) { throw "3D validation failed with code $LASTEXITCODE" }
          & $godot --headless --path godot --script res://scripts/validate_gameplay.gd
          if ($LASTEXITCODE -ne 0) { throw "Gameplay validation failed with code $LASTEXITCODE" }

      - name: Package and launch-test complete Godot Windows game
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force package-windows | Out-Null
          New-Item -ItemType Directory -Force dist-windows | Out-Null
          Copy-Item godot-engine\Godot_v4.7.2-stable_win64.exe package-windows\FormFactor.exe
          Copy-Item godot\project.godot package-windows\project.godot
          Copy-Item godot\scenes package-windows\scenes -Recurse
          Copy-Item godot\scripts package-windows\scripts -Recurse
          Copy-Item VERSION package-windows\VERSION
          @'
          @echo off
          cd /d "%~dp0"
          "FormFactor.exe" --path "%~dp0"
          '@ | Set-Content -Encoding ASCII package-windows\PLAY_FORMFACTOR.bat
          @"
          FormFactor $version - PCB Training + Build Lab

          PLAY
          1. Extract this ZIP and double-click PLAY_FORMFACTOR.bat.
          2. Pick a component from the left component menu and click the PCB to place it.
          3. Drag a placed component to move it. Drag empty board/workbench space to rotate the camera.
          4. Click a placed component and use Q/E or the on-screen buttons to rotate the component.
          5. Use WIRE to connect parts and TEST to validate a connected power-to-LED path.
          6. Open LEARN // 100 LESSONS for the guided PCB curriculum from basics through capstone boards.
          7. Every lesson increases in designed difficulty by 1 percent. Training certificates unlock at 10, 25, 50, 75, and 100 completed lessons.
          8. The live schematic mirror and 25-family component lexicon stay available while you build.

          Certificate note: the game can generate a named local digital completion certificate. Automatic email delivery requires a separately configured secure FORMFACTOR_CERTIFICATE_API service so mail credentials are never embedded in the game executable.

          Godot is open source under the MIT license: https://godotengine.org/license/
          "@ | Set-Content -Encoding UTF8 package-windows\README.txt

          $exePath = (Resolve-Path package-windows\FormFactor.exe).Path
          $projectPath = (Resolve-Path package-windows).Path
          $process = Start-Process -FilePath $exePath -ArgumentList @('--headless', '--path', $projectPath, '--quit-after', '3') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged FormFactor.exe failed its launch gate with code $($process.ExitCode)" }

          $archive = Join-Path (Resolve-Path dist-windows) "FormFactor-$version-Windows-x64.zip"
          Compress-Archive -Path package-windows\* -DestinationPath $archive -Force
          if (-not (Test-Path $archive)) { throw "Windows archive was not created: $archive" }
          $zip = Get-Item $archive
          if ($zip.Length -le 0) { throw "Windows archive is empty: $archive" }
          Write-Host "Created tested Windows archive: $($zip.FullName) ($($zip.Length) bytes)"

      - name: Upload Windows playable
        uses: actions/upload-artifact@v4
        with:
          name: windows-playable
          path: dist-windows/FormFactor-*-Windows-x64.zip
          if-no-files-found: error

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out FormFactor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download tested packages
        uses: actions/download-artifact@v4
        with:
          pattern: '*-playable'
          path: dist
          merge-multiple: true

      - name: Tag the tested build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          VERSION_TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$VERSION_TAG" "$GITHUB_SHA"
          git tag -f latest "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION_TAG" --force
          git push origin refs/tags/latest --force

      - name: Publish versioned training release and refresh latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          VERSION_TAG="v${VERSION}"
          NOTES="FormFactor ${VERSION} adds movable player-placed components, component rotation, connected-wire redraw, an in-game quick-start guide, 100 progressive PCB lessons across 10 modules, a one-percent-per-lesson difficulty curve, persistent training progress, and five digital training certificate milestones at 10, 25, 50, 75, and 100 lessons. The 25-family component lexicon and live schematic mirror remain integrated. Named certificates can be generated locally; automatic email delivery is supported through a separately configured secure certificate API rather than embedding mail credentials in the game. Both packaged builds are launch-tested before publication."

          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" dist/* --clobber
            gh release edit "$VERSION_TAG" --title "FormFactor ${VERSION}" --notes "$NOTES" --latest
          else
            gh release create "$VERSION_TAG" dist/* --title "FormFactor ${VERSION}" --notes "$NOTES" --latest
          fi

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/* --clobber
            gh release edit latest --title "FormFactor ${VERSION} - Latest Playable" --notes "$NOTES"
          else
            gh release create latest dist/* --title "FormFactor ${VERSION} - Latest Playable" --notes "$NOTES"
          fi
