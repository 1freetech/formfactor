name: playable-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formfactor-playable-release
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out FormFactor
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libssl-dev patchelf

      - name: Configure release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build FormFactor
        run: cmake --build build --parallel 2

      - name: Run tests before publishing
        run: ctest --test-dir build --output-on-failure

      - name: Package portable Linux build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-linux/lib
          cp build/formfactor_freelab package-linux/FormFactor

          ldd build/formfactor_freelab \
            | awk '/=> \/.*\.so/ {print $3}' \
            | sort -u \
            | while read -r lib; do
                case "$(basename "$lib")" in
                  libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*)
                    continue
                    ;;
                esac
                cp -L "$lib" package-linux/lib/
              done

          patchelf --set-rpath '$ORIGIN/lib' package-linux/FormFactor
          for lib in package-linux/lib/*.so*; do
            [ -e "$lib" ] || continue
            patchelf --set-rpath '$ORIGIN' "$lib" || true
          done

          cat > package-linux/README.txt <<'TXT'
          FormFactor Linux playable build

          1. Extract this archive.
          2. Double-click FormFactor, or run ./FormFactor.
          3. Press Esc to close the current FreeLab prototype.

          This package is built automatically from the latest main-branch commit after the test suite passes.
          TXT

          chmod +x package-linux/FormFactor
          tar -czf FormFactor-Linux-x64.tar.gz -C package-linux .

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-playable
          path: FormFactor-Linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out FormFactor
        uses: actions/checkout@v4

      - name: Install MinGW, CMake, SDL2, and OpenSSL
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkgconf

      - name: Configure release build
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build FormFactor
        shell: msys2 {0}
        run: cmake --build build --parallel 2

      - name: Run tests before publishing
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Collect Windows executable and DLLs
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p package-windows
          cp build/formfactor_freelab.exe package-windows/FormFactor.exe

          ldd build/formfactor_freelab.exe \
            | awk '/\/mingw64\/bin\// {print $3}' \
            | sort -u \
            | while read -r dll; do
                cp "$dll" package-windows/
              done

          cat > package-windows/README.txt <<'TXT'
          FormFactor Windows playable build

          1. Extract this ZIP.
          2. Double-click FormFactor.exe.
          3. Press Esc to close the current FreeLab prototype.

          This package is built automatically from the latest main-branch commit after the test suite passes.
          TXT

      - name: Create Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path package-windows\* -DestinationPath FormFactor-Windows-x64.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-playable
          path: FormFactor-Windows-x64.zip
          if-no-files-found: error

  publish-latest:
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out FormFactor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download tested packages
        uses: actions/download-artifact@v4
        with:
          pattern: '*-playable'
          path: dist
          merge-multiple: true

      - name: Point the latest tag at this tested commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Create or refresh the latest playable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/FormFactor-Windows-x64.zip dist/FormFactor-Linux-x64.tar.gz --clobber
            gh release edit latest \
              --title "FormFactor - Latest Playable Build" \
              --notes "Automatic tested playable build from the latest main-branch commit. Download the Windows ZIP or Linux archive below." \
              --latest
          else
            gh release create latest \
              dist/FormFactor-Windows-x64.zip \
              dist/FormFactor-Linux-x64.tar.gz \
              --title "FormFactor - Latest Playable Build" \
              --notes "Automatic tested playable build from the latest main-branch commit. Download the Windows ZIP or Linux archive below."
          fi
