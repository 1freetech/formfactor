<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05090b"/>
    <stop offset="1" stop-color="#10191d"/>
  </linearGradient>
  <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b5b35"/>
    <stop offset="1" stop-color="#0b3822"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="78" y="82" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#39ff14" filter="url(#glow)">FORMFACTOR 1.126</text>
<text x="80" y="126" font-family="Arial,sans-serif" font-size="24" fill="#cfe3e7">EDITOR FIXES • BUILD → MOVE → WIRE → UNDO</text>

<!-- board -->
<g transform="translate(70 178)">
  <rect x="0" y="0" width="930" height="620" rx="28" fill="#071013" stroke="#263a40" stroke-width="3"/>
  <rect x="44" y="54" width="842" height="500" rx="18" fill="url(#pcb)" stroke="#39ff14" stroke-opacity=".52" stroke-width="3"/>
  <text x="66" y="38" font-family="Arial,sans-serif" font-size="18" fill="#739095">CURRENT PLAYABLE BOARD</text>

  <!-- power block -->
  <g transform="translate(120 210)">
    <rect x="0" y="0" width="126" height="86" rx="8" fill="#14543d" stroke="#8fb6aa" stroke-width="2"/>
    <circle cx="38" cy="24" r="13" fill="#b9c3c6"/>
    <circle cx="88" cy="24" r="13" fill="#b9c3c6"/>
    <rect x="30" y="70" width="12" height="44" fill="#b9c3c6"/>
    <rect x="84" y="70" width="12" height="44" fill="#b9c3c6"/>
  </g>

  <!-- resistor -->
  <g transform="translate(386 240)">
    <line x1="-80" y1="32" x2="0" y2="32" stroke="#b9c3c6" stroke-width="8"/>
    <line x1="170" y1="32" x2="250" y2="32" stroke="#b9c3c6" stroke-width="8"/>
    <rect x="0" y="0" width="170" height="64" rx="28" fill="#c49a5a" stroke="#dbc18c" stroke-width="3"/>
    <rect x="35" y="0" width="12" height="64" fill="#5c1b10"/>
    <rect x="68" y="0" width="12" height="64" fill="#151515"/>
    <rect x="101" y="0" width="12" height="64" fill="#cf321c"/>
    <rect x="134" y="0" width="12" height="64" fill="#d2a521"/>
  </g>

  <!-- LED -->
  <g transform="translate(720 196)">
    <line x1="38" y1="104" x2="38" y2="170" stroke="#b9c3c6" stroke-width="8"/>
    <line x1="86" y1="104" x2="86" y2="170" stroke="#b9c3c6" stroke-width="8"/>
    <rect x="18" y="68" width="88" height="36" rx="12" fill="#a42420"/>
    <circle cx="62" cy="66" r="48" fill="#ec3b34" fill-opacity=".74" stroke="#ff8d82" stroke-width="3"/>
  </g>

  <!-- stable wire -->
  <path d="M240 344 C310 430, 420 430, 500 342 S710 270, 754 340" fill="none" stroke="#ff891c" stroke-width="10" stroke-linecap="round"/>
  <circle cx="240" cy="344" r="10" fill="#ff891c"/>
  <circle cx="754" cy="340" r="10" fill="#ff891c"/>

  <!-- selection bounds -->
  <rect x="290" y="220" width="360" height="120" rx="14" fill="none" stroke="#00e5ff" stroke-width="3" stroke-dasharray="12 9"/>

  <text x="75" y="520" font-family="Arial,sans-serif" font-size="18" fill="#e0eeee">Blank PCB stays clean. Parts keep their current 3D models after undo.</text>
</g>

<!-- fix cards -->
<g transform="translate(1040 178)">
  <rect width="490" height="182" rx="18" fill="#0b1519" stroke="#1f3a42" stroke-width="2"/>
  <text x="28" y="42" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#39ff14">FIX 1 • UNDO / REDO</text>
  <path d="M76 100 A38 38 0 1 1 104 129" fill="none" stroke="#39ff14" stroke-width="8"/>
  <path d="M60 78 L78 103 L94 78" fill="none" stroke="#39ff14" stroke-width="8"/>
  <text x="145" y="92" font-family="Arial,sans-serif" font-size="18" fill="#d9e7ea">Restored parts now keep the</text>
  <text x="145" y="120" font-family="Arial,sans-serif" font-size="18" fill="#d9e7ea">new electronics-specific 3D shape.</text>

  <g transform="translate(0 204)">
    <rect width="490" height="182" rx="18" fill="#0b1519" stroke="#1f3a42" stroke-width="2"/>
    <text x="28" y="42" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#39ff14">FIX 2 • MOVED WIRES</text>
    <line x1="55" y1="110" x2="195" y2="110" stroke="#ff891c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="55" cy="110" r="9" fill="#ff891c"/>
    <circle cx="195" cy="110" r="9" fill="#ff891c"/>
    <text x="225" y="92" font-family="Arial,sans-serif" font-size="18" fill="#d9e7ea">Moving a connected part no longer</text>
    <text x="225" y="120" font-family="Arial,sans-serif" font-size="18" fill="#d9e7ea">changes wire height or thickness.</text>
  </g>

  <g transform="translate(0 408)">
    <rect width="490" height="212" rx="18" fill="#0b1519" stroke="#1f3a42" stroke-width="2"/>
    <text x="28" y="42" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#39ff14">FIX 3 • LIVE SCHEMATIC</text>
    <line x1="44" y1="92" x2="110" y2="92" stroke="#dbe9ec" stroke-width="3"/>
    <rect x="110" y="77" width="74" height="30" fill="none" stroke="#dbe9ec" stroke-width="3"/>
    <line x1="184" y1="92" x2="236" y2="92" stroke="#dbe9ec" stroke-width="3"/>
    <path d="M236 92 H270 V142 H336" fill="none" stroke="#ff891c" stroke-width="4"/>
    <circle cx="336" cy="142" r="7" fill="#ff891c"/>
    <text x="44" y="174" font-family="Arial,sans-serif" font-size="18" fill="#d9e7ea">The schematic now draws the player’s real</text>
    <text x="44" y="201" font-family="Arial,sans-serif" font-size="18" fill="#d9e7ea">component-to-component connections.</text>
  </g>
</g>
</svg>